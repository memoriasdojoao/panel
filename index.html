<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TABLERO DE CAMAS - HOSPITAL LUISA CRAVENA DE GANDULFO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* ============ BASE ============ */
* { box-sizing: border-box; margin: 0; padding: 0; }
*, input, button { text-transform: uppercase; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; }
html { font-size: clamp(11px, min(0.9vw, 1.45vh), 22px); height: 100%; }
html, body { height: 100%; width: 100vw; }
:root { --rh: 4rem; --fs: 22px; --rhb: 4rem; }
body { background: #f1f5f9; color: #0f172a; display: flex; flex-direction: column; overflow: hidden; user-select: none; }

/* ============ MARQUESINA ============ */
.mq { height: 44px; flex: none; display: flex; align-items: center; overflow: hidden; background: #1e3a8a; border-bottom: 3px solid #1d4ed8; padding: 0 .5rem; }
.mq-track { flex: 1; overflow: hidden; white-space: nowrap; display: flex; align-items: center; }
.mqc { display: inline-block; padding-left: 100%; animation: mq 28s linear infinite; font-size: 1.2rem; font-weight: 900; letter-spacing: .05em; color: #fff; }
@keyframes mq { to { transform: translateX(-100%); } }

/* ============ ESTRUTURA: SALA 50% | SHOCKROOMS 50% ============ */
main { flex: 1 1 0; min-height: 0; display: flex; gap: .5rem; padding: .5rem; overflow: hidden; }
.col-left, .col-right { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: .5rem; overflow: hidden; }
.row-bottom { flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; padding: 0 .5rem .5rem; }

/* ============ PAINEIS ============ */
.panel { background: #fff; border: 1px solid #cbd5e1; border-radius: .4rem; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.col-left .panel { flex: 1 1 auto; min-height: 0; }
.col-right .panel { flex: none; }
.ph { display: flex; justify-content: space-between; align-items: center; padding: .35rem .8rem; background: #f8fafc; border-bottom: 2px solid #e2e8f0; flex: none; }
.row-bottom .ph { padding: .25rem .8rem; }
.ph h2 { font-size: 1.1rem; font-weight: 900; color: #1e3a8a; }
.btn { background: #1e3a8a; color: #fff; border: none; font-weight: 800; font-size: .75rem; border-radius: .2rem; padding: .3rem .7rem; cursor: pointer; }
.btn:hover { background: #2563eb; }
.btn.btn-remove { background: #dc2626; }
.btn.btn-remove:hover { background: #b91c1c; }
.rows { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: .2rem; padding: .3rem; overflow: hidden; }

/* ============ LINHAS GRANDES ============ */
.row { flex: none; height: var(--rh); display: grid; align-items: center; background: #fff; border: 1px solid #cbd5e1; cursor: pointer; }
.row:hover { background: #f1f5f9; }
.row:not(.c) {
  grid-template-columns: calc(var(--fs) * 4.3) minmax(0, 1.45fr) calc(var(--fs) * 3.2) minmax(0, 1fr);
  column-gap: calc(var(--fs) * .5);
  padding: 0 calc(var(--fs) * .5);
}
.row:not(.c) .lbl { font-size: calc(var(--fs) * .58); }
.row:not(.c) .nom { font-size: var(--fs); }
.row:not(.c).free .nom { grid-column: 2 / -1; font-size: calc(var(--fs) * .62); }
.ed { text-align: center; white-space: nowrap; min-width: 0; font-size: calc(var(--fs) * .85); font-weight: 900; color: #334155; line-height: 1.1; }
.ed::before { content: attr(data-l); display: block; font-size: .36em; font-weight: 800; color: #64748b; line-height: 1.2; }
.dx { font-size: calc(var(--fs) * .68); font-weight: 800; color: #334155; line-height: 1.1; min-width: 0; overflow-wrap: break-word; }

.lbl { font-weight: 900; color: #1e3a8a; background: #e2e8f0; border-radius: .2rem; padding: .3em .4em; text-align: center; white-space: nowrap; }
.nom { font-weight: 900; color: #0f172a; white-space: nowrap; line-height: 1.15; min-width: 0; }
.free .nom { color: #64748b; font-weight: 600; }

/* ============ LINHAS COMPACTAS ============ */
.row-bottom .rows { min-height: calc(var(--rhb) * 2 + .8rem); overflow-y: auto; }
.row.c {
  height: var(--rhb);
  grid-template-columns: 6rem minmax(0, 1fr);
  grid-template-rows: auto auto;
  align-content: center;
  column-gap: .7rem;
  row-gap: .05rem;
  padding: 0 .6rem;
}
.row.c .lbl { grid-row: 1 / span 2; align-self: center; font-size: .85rem; }
.row.c .nom { grid-column: 2; grid-row: 1; font-size: 1.4rem; }
.row.c .meta { grid-column: 2; grid-row: 2; display: flex; gap: 1rem; white-space: nowrap; font-size: 1rem; font-weight: 800; color: #334155; line-height: 1.15; min-width: 0; }
.row.c .meta i { font-style: normal; font-size: .75em; color: #64748b; margin-right: .3em; }
.row.c.free .nom { grid-row: 1 / span 2; align-self: center; font-size: 1rem; }

/* ============ MODAL ============ */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 50; }
#modal.on { display: flex; }
.mbox { background: #fff; border-radius: .5rem; width: 100%; max-width: 40rem; overflow: hidden; }
.mh { background: #1e3a8a; padding: 1rem; display: flex; justify-content: space-between; color: #fff; }
.mh h3 { font-size: 1.2rem; }
.x { background: none; border: 0; color: #fff; font-size: 1.5rem; cursor: pointer; }
form { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
label { font-size: .8rem; font-weight: 800; color: #334155; }
input { width: 100%; padding: .5rem; border: 2px solid #cbd5e1; border-radius: .3rem; font-size: 1.1rem; font-weight: 800; user-select: text; }
.mf { display: flex; justify-content: space-between; margin-top: 1rem; }
.bt { padding: .7rem 1.2rem; font-weight: 900; cursor: pointer; border: none; border-radius: .3rem; color: #fff; }
.bt.blue { background: #1e3a8a; }
.bt.red { background: #dc2626; }
.bt.gray { background: #64748b; }
</style>
</head>
<body>
<header class="mq">
  <div class="mq-track"><div class="mqc" id="mq">HOSPITAL LUISA CRAVENA DE GANDULFO</div></div>
</header>

<main>
  <div class="col-left">
    <section class="panel" id="p-sala">
      <div class="ph"><h2>SALA</h2></div>
      <div class="rows" id="r-sala"></div>
    </section>
  </div>
  <div class="col-right">
    <section class="panel" id="p-sr1">
      <div class="ph"><h2>SHOCKROOM 1</h2><button id="btn-sr1" class="btn" onclick="toggleBis('sr1')">+ AGREGAR 5-BIS</button></div>
      <div class="rows" id="r-sr1"></div>
    </section>
    <section class="panel" id="p-sr2">
      <div class="ph"><h2>SHOCKROOM 2</h2><button id="btn-sr2" class="btn" onclick="toggleBis('sr2')">+ AGREGAR 6-BIS</button></div>
      <div class="rows" id="r-sr2"></div>
    </section>
  </div>
</main>

<div class="row-bottom">
  <section class="panel">
    <div class="ph"><h2>INGRESOS</h2><div style="display:flex; gap:.35rem;"><button class="btn" onclick="addSlot('ing')">+ ESPACIO</button><button class="btn btn-remove" onclick="removeSlot('ing')">- QUITAR ESPACIO</button></div></div>
    <div class="rows" id="r-ing"></div>
  </section>
  <section class="panel">
    <div class="ph"><h2>DERIVACIONES</h2><div style="display:flex; gap:.35rem;"><button class="btn" onclick="addSlot('der')">+ ESPACIO</button><button class="btn btn-remove" onclick="removeSlot('der')">- QUITAR ESPACIO</button></div></div>
    <div class="rows" id="r-der"></div>
  </section>
  <section class="panel">
    <div class="ph"><h2>ÓBITOS</h2><div style="display:flex; gap:.35rem;"><button class="btn" onclick="addSlot('obi')">+ ESPACIO</button><button class="btn btn-remove" onclick="removeSlot('obi')">- QUITAR ESPACIO</button></div></div>
    <div class="rows" id="r-obi"></div>
  </section>
</div>

<div id="modal">
  <div class="mbox">
    <div class="mh"><h3 id="m-title">REGISTRAR PACIENTE</h3><button type="button" class="x" onclick="closeModal()">X</button></div>
    <form onsubmit="saveForm(event)">
      <input type="hidden" id="m-id">
      <input type="hidden" id="m-type">
      <div><label>NOMBRE COMPLETO</label><input id="m-nom" required autocomplete="off"></div>
      <div id="box-dni"><label>DNI</label><input id="m-dni" autocomplete="off"></div>
      <div style="display:flex; gap:1rem;">
        <div style="flex:1"><label>EDAD</label><input id="m-edad" required autocomplete="off"></div>
        <div style="flex:2"><label>DIAGNÓSTICO (DX)</label><input id="m-dx" required autocomplete="off"></div>
      </div>
      <div class="mf">
        <button type="button" class="bt red" id="btn-free" onclick="freeBed()">LIBERAR</button>
        <div style="display:flex; gap:.5rem;">
          <button type="button" class="bt gray" onclick="closeModal()">CANCELAR</button>
          <button type="submit" class="bt blue">GUARDAR</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
const state = JSON.parse(localStorage.getItem('HOSPITAL_GANDULFO')) || {
  sala: Array(8).fill(null),
  sr1: Array(5).fill(null), sr1_bis: false,
  sr2: Array(3).fill(null), sr2_bis: false,
  ing: [null, null], der: [null, null], obi: [null]
};

function save() { localStorage.setItem('HOSPITAL_GANDULFO', JSON.stringify(state)); render(); }

function clock() {
  const n = new Date(), p = x => String(x).padStart(2, '0');
  const weather = localStorage.getItem('HOSPITAL_GANDULFO_WEATHER');
  let weatherText = 'CLIMA: SIN DATOS';
  if (weather) {
    try {
      const saved = JSON.parse(weather);
      weatherText = `CLIMA: ${saved.temperature}°C BUENOS AIRES${saved.updated ? ' (ÚLTIMO DATO)' : ''}`;
    } catch (_) {}
  }
  document.getElementById('mq').innerHTML = `HOSPITAL LUISA CRAVENA DE GANDULFO &nbsp;&nbsp;•&nbsp;&nbsp; FECHA: ${p(n.getDate())}/${p(n.getMonth()+1)}/${n.getFullYear()} &nbsp;&nbsp;•&nbsp;&nbsp; HORA: ${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())} &nbsp;&nbsp;•&nbsp;&nbsp; ${weatherText}`;
}
async function updateWeather() {
  if (!navigator.onLine) return;
  try {
    const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-34.6037&longitude=-58.3816&current=temperature_2m&timezone=America%2FArgentina%2FBuenos_Aires', { cache: 'no-store' });
    if (!response.ok) throw new Error('Weather request failed');
    const data = await response.json();
    const temperature = Math.round(data.current.temperature_2m);
    localStorage.setItem('HOSPITAL_GANDULFO_WEATHER', JSON.stringify({ temperature, updated: new Date().toISOString() }));
  } catch (_) { /* Mantiene el último dato guardado si no puede conectarse. */ }
  clock();
}
setInterval(clock, 1000); clock();
updateWeather();
setInterval(updateWeather, 10 * 60 * 1000);
window.addEventListener('online', updateWeather);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function bedHtml(type, idx, label, data) {
  const compact = ['ing', 'der', 'obi'].includes(type);
  const cls = 'row' + (compact ? ' c' : '');
  if (!data) {
     return `<div class="${cls} free" onclick="openModal('${type}',${idx},'${label}')"><span class="lbl">${label}</span><span class="nom"></span></div>`;
  }
  const click = `onclick="openModal('${type}',${idx},'${label}', true)"`;
  if (compact) {
    const dni = data.dni ? `<span><i>DNI</i>${esc(data.dni)}</span>` : '';
    return `<div class="${cls}" ${click}><span class="lbl">${label}</span><span class="nom fit">${esc(data.nom)}</span><div class="meta fit">${dni}<span><i>EDAD</i>${esc(data.edad)}</span><span><i>DX</i>${esc(data.dx)}</span></div></div>`;
  }
  return `<div class="${cls}" ${click}><span class="lbl">${label}</span><span class="nom fit">${esc(data.nom)}</span><span class="ed fit" data-l="EDAD">${esc(data.edad)}</span><span class="dx fit">${esc(data.dx)}</span></div>`;
}

function render() {
  document.getElementById('r-sala').innerHTML = state.sala.map((d,i) => bedHtml('sala', i, 'CAMA '+(i+1), d)).join('');

  let htmlSr1 = state.sr1.slice(0,5).map((d,i) => bedHtml('sr1', i, 'CAMA '+(i+1), d)).join('');
  if (state.sr1_bis) htmlSr1 += bedHtml('sr1', 5, 'CAMA 5-BIS', state.sr1[5]);
  document.getElementById('r-sr1').innerHTML = htmlSr1;

  let htmlSr2 = state.sr2.slice(0,3).map((d,i) => bedHtml('sr2', i, 'CAMA '+(i+6), d)).join('');
  if (state.sr2_bis) htmlSr2 += bedHtml('sr2', 3, 'CAMA 6-BIS', state.sr2[3]);
  document.getElementById('r-sr2').innerHTML = htmlSr2;

  document.getElementById('r-ing').innerHTML = state.ing.map((d,i) => bedHtml('ing', i, 'ING. '+(i+1), d)).join('');
  document.getElementById('r-der').innerHTML = state.der.map((d,i) => bedHtml('der', i, 'DERIV. '+(i+1), d)).join('');
  document.getElementById('r-obi').innerHTML = state.obi.map((d,i) => bedHtml('obi', i, 'ÓBITO '+(i+1), d)).join('');
  
  // Atualiza botões
  const btnSr1 = document.getElementById('btn-sr1');
  const btnSr2 = document.getElementById('btn-sr2');
  
  if (state.sr1_bis) {
    btnSr1.innerText = '- QUITAR 5-BIS';
    btnSr1.classList.add('btn-remove');
  } else {
    btnSr1.innerText = '+ AGREGAR 5-BIS';
    btnSr1.classList.remove('btn-remove');
  }

  if (state.sr2_bis) {
    btnSr2.innerText = '- QUITAR 6-BIS';
    btnSr2.classList.add('btn-remove');
  } else {
    btnSr2.innerText = '+ AGREGAR 6-BIS';
    btnSr2.classList.remove('btn-remove');
  }

  fit();
}

function fitEl(el) {
  el.style.fontSize = '';
  const row = el.closest('.row');
  const maxH = row.clientHeight - 6;
  let size = parseFloat(getComputedStyle(el).fontSize);
  while (size > 8 && (el.scrollWidth > el.clientWidth + 1 || el.offsetHeight > maxH)) {
    size -= 0.5;
    el.style.fontSize = size + 'px';
  }
}

function fit() {
  const root = document.documentElement;
  const rem = parseFloat(getComputedStyle(root).fontSize);
  const pad = .3 * rem, gap = .2 * rem, colGap = .5 * rem;
  let rh = Infinity;

  document.querySelectorAll('.col-left, .col-right').forEach(col => {
    const panels = [...col.querySelectorAll(':scope > .panel')];
    let overhead = (panels.length - 1) * colGap, n = 0;
    panels.forEach(p => {
      const c = p.querySelectorAll('.row').length;
      n += c;
      overhead += p.querySelector('.ph').offsetHeight + 2 + 2 * pad + Math.max(c - 1, 0) * gap;
    });
    if (n > 0) rh = Math.min(rh, (col.clientHeight - overhead) / n);
  });

  if (isFinite(rh)) {
    rh = Math.max(Math.floor(rh) - 1, 24);
    root.style.setProperty('--rh', rh + 'px');
    root.style.setProperty('--fs', Math.max(13, Math.min(rh * .34, 44)) + 'px');

    /* AGORA UTILIZA SPACE-BETWEEN PARA NÃO DEIXAR LACUNA NO FINAL DO PAINEL DA SALA */
    document.querySelectorAll('.col-left .rows, .col-right .rows').forEach(r => {
      r.style.justifyContent = 'space-between';
    });
  }
  document.querySelectorAll('.fit').forEach(fitEl);
}
window.addEventListener('resize', fit);
window.addEventListener('load', fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

function toggleBis(room) {
  state[room+'_bis'] = !state[room+'_bis'];
  if (state[room+'_bis'] && state[room].length === (room==='sr1' ? 5 : 3)) state[room].push(null);
  save();
}
function addSlot(type) { state[type].push(null); save(); }

function removeSlot(type) {
  const minimum = type === 'obi' ? 1 : 2;
  if (state[type].length <= minimum) {
    alert('NO SE PUEDEN QUITAR LOS ESPACIOS INICIALES.');
    return;
  }
  const last = state[type][state[type].length - 1];
  if (last && !confirm('EL ÚLTIMO ESPACIO TIENE UN PACIENTE REGISTRADO. ¿QUITARLO Y BORRAR SUS DATOS?')) {
    return;
  }
  state[type].pop();
  save();
}

function openModal(type, idx, label, isEdit=false) {
  document.getElementById('modal').classList.add('on');
  document.getElementById('m-title').innerText = (isEdit ? 'EDITAR ' : 'REGISTRAR ') + label;
  document.getElementById('m-type').value = type;
  document.getElementById('m-id').value = idx;

  const needsDni = ['ing','der','obi'].includes(type);
  document.getElementById('box-dni').style.display = needsDni ? 'block' : 'none';
  document.getElementById('btn-free').style.display = isEdit ? 'block' : 'none';

  const d = state[type][idx];
  document.getElementById('m-nom').value = d ? d.nom : '';
  document.getElementById('m-dni').value = d ? (d.dni||'') : '';
  document.getElementById('m-edad').value = d ? d.edad : '';
  document.getElementById('m-dx').value = d ? d.dx : '';
  setTimeout(() => document.getElementById('m-nom').focus(), 100);
}
function closeModal() { document.getElementById('modal').classList.remove('on'); }

function saveForm(e) {
  e.preventDefault();
  const type = document.getElementById('m-type').value;
  const idx = document.getElementById('m-id').value;
  state[type][idx] = {
    nom: document.getElementById('m-nom').value.toUpperCase(),
    dni: document.getElementById('m-dni').value.toUpperCase(),
    edad: document.getElementById('m-edad').value.toUpperCase(),
    dx: document.getElementById('m-dx').value.toUpperCase()
  };
  save(); closeModal();
}

function freeBed() {
  const type = document.getElementById('m-type').value;
  const idx = document.getElementById('m-id').value;
  state[type][idx] = null;
  save(); closeModal();
}

render();
</script>
</body>
</html>
